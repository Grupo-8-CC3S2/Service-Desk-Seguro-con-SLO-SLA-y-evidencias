name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  chequeo-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Clona repo actual en VM temporal de Git
        uses: actions/checkout@v4
      - name: Descarga python en la VM 
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instala dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black ruff flake8 mypy pytest
      - name: Lint (ruff/flake8) estilo analisis estatico
        run: |
          ruff check .
          flake8 .
      - name: Format check (black) formateo correcto
        run: black --check .
      - name: Type check (mypy) anotaciones python 
        run: mypy .
      - name: Ejecuta tests
        run: pytest -q
